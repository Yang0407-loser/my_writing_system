[project]
name = "my-writing-system"
version = "0.9.0"
description = "Multi-agent collaborative writing system with RAG, using BGE-M3 embeddings and DeepSeek V4 Pro"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "chromadb>=0.5.0",
    "openai>=1.30.0",
    "sentence-transformers>=3.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "requests>=2.32.0",
    "jieba>=0.42",
    "sqlalchemy>=2.0.51,<2.1",
    "alembic>=1.18.5,<2",
    "psycopg[binary]>=3.3.4,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "fakeredis[lua]>=2.21",
    "httpx>=0.27.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = '-m "not historical_artifact"'
markers = [
    "historical_artifact: requires historical/generated artifacts or verifies frozen experimental hashes; excluded from the default CI-safe suite",
    "postgres: requires TEST_CANONICAL_DATABASE_URL and a real PostgreSQL test database",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.wheel]
packages = ["app", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
